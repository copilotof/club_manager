name: fight_club_manager
description: "نظام إدارة المدارس الرياضية وفنون القتال"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # ==================== إدارة الحالة ====================
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5
  flutter_native_splash: ^2.4.0

  # ==================== التوجيه ====================
  go_router: ^14.6.2

  # ==================== الخطوط والأيقونات ====================
  google_fonts: ^6.2.1
  iconsax: ^0.0.8
  cupertino_icons: ^1.0.9

  # ==================== التخزين المحلي ====================
  sqflite: ^2.4.1
  path_provider: ^2.1.5

  # ==================== السحابة والمزامنة ====================
  supabase_flutter: ^2.8.1

  # ==================== QR Code ====================
  mobile_scanner: ^7.0.1
  qr_flutter: ^4.1.0

  # ==================== أدوات مساعدة ====================
  intl: ^0.19.0
  connectivity_plus: ^6.1.2
  shared_preferences: ^2.3.4
  permission_handler: ^11.3.1
  just_audio: ^0.9.42

  # ==================== حقن التبعيات ====================
  get_it: ^8.0.3

  # ==================== التقارير والرسوم البيانية ====================
  pdf: ^3.11.1
  printing: ^5.13.4
  fl_chart: ^1.2.0

  # ==================== تأثيرات حركية ====================
  animate_do: ^3.3.4

  # ==================== الصور والمشاركة ====================
  image_picker: ^1.1.2
  share_plus: ^10.1.4

  # ==================== إدارة الملفات ====================
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/